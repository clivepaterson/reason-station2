AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stores production Google OAuth credentials and grants the application
  read-only access - secret values are entered separately in the AWS console.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@v3
  com.aws.cloudformation.Context:
    arch: one Secrets Manager JSON secret -> Spring config import
    must:
      - Set google.client-id and google.client-secret before starting production

Parameters:
  ApplicationRoleName:
    Type: String
    MinLength: 1
    Description: Name of the existing IAM role used by the production application.
  GoogleOAuthSecretName:
    Type: String
    Default: /reasonstation/prod/google-oauth
    AllowedPattern: "^/[A-Za-z0-9/_+=.@-]+$"
    ConstraintDescription: Must be an absolute Secrets Manager name beginning with /.
    Description: Secret name; set GOOGLE_OAUTH_SECRET_NAME when overriding this default.

Resources:
  GoogleOAuthSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: holds Google OAuth client credentials outside app cfg; value is entered in console after stack creation
        must:
          - JSON keys must be google.client-id and google.client-secret
          - Retain on stack deletion or replacement
        mutable: change-with-constraints
        mutability:
          Name: must-never-change
    Properties:
      Name: !Ref GoogleOAuthSecretName
      Description: Google OAuth credentials for the Reason Station production application.
      Tags:
        - Key: Application
          Value: reasonstation
        - Key: Environment
          Value: production

  GoogleOAuthSecretReadPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      com.aws.cloudformation.Context:
        why: lets only the existing production runtime role read this one secret
        must:
          - Keep resource scoped to GoogleOAuthSecret
          - Do not grant secret mutation actions
        mutable: change-with-constraints
    Properties:
      PolicyName: !Sub "${AWS::StackName}-google-oauth-secret-read"
      Roles:
        - !Ref ApplicationRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadGoogleOAuthSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref GoogleOAuthSecret

Outputs:
  GoogleOAuthSecretArn:
    Description: ARN of the Google OAuth secret.
    Value: !Ref GoogleOAuthSecret
  GoogleOAuthSecretName:
    Description: Name imported by the production Spring profile.
    Value: !Ref GoogleOAuthSecretName
