AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stores production application secrets and grants the application read-only
  access - secret values are entered separately in the AWS console.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: one Secrets Manager JSON secret -> Spring config import
    must:
      - JSON keys must be Spring configuration property names
      - Keep RDS master credentials in the separate RDS-managed secret

Parameters:
  ApplicationRoleName:
    Type: String
    MinLength: 1
    Description: Name of the existing IAM role used by the production application.
  ApplicationSecretName:
    Type: String
    Default: /reasonstation/prod/application
    AllowedPattern: "^/[A-Za-z0-9/_+=.@-]+$"
    ConstraintDescription: Must be an absolute Secrets Manager name beginning with /.
    Description: Secret name; set APPLICATION_SECRET_NAME when overriding this default.

Resources:
  ApplicationSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: holds production app secrets outside source cfg; values are entered in console after stack creation
        must:
          - JSON keys must match Spring configuration property names
          - Do not store RDS master credentials here; RDS manages those separately
          - Retain on stack deletion or replacement
        mutable: change-with-constraints
        mutability:
          Name: must-never-change
    Properties:
      Name: !Ref ApplicationSecretName
      Description: Secrets for the Reason Station production application.
      Tags:
        - Key: Application
          Value: reasonstation
        - Key: Environment
          Value: production

  ApplicationSecretReadPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      com.aws.cloudformation.Context:
        why: lets only the existing production runtime role read this one secret
        must:
          - Keep resource scoped to ApplicationSecret
          - Do not grant secret mutation actions
        mutable: change-with-constraints
    Properties:
      PolicyName: !Sub "${AWS::StackName}-application-secret-read"
      Roles:
        - !Ref ApplicationRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadApplicationSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref ApplicationSecret

Outputs:
  ApplicationSecretArn:
    Description: ARN of the production application secret.
    Value: !Ref ApplicationSecret
  ApplicationSecretName:
    Description: Name imported by the production Spring profile.
    Value: !Ref ApplicationSecretName
