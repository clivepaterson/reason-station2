AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stores Reason Station production application secrets - the deployment workflow
  populates runtime values after dependent infrastructure is available.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: one Secrets Manager JSON secret -> Spring config import
    must:
      - JSON keys must be Spring configuration property names
      - Keep RDS master credentials in the separate RDS-managed secret
      - Grant read access from the consuming workload stack to avoid circular dependencies

Parameters:
  ApplicationSecretName:
    Type: String
    Default: /reasonstation/prod/application
    AllowedPattern: "^/[A-Za-z0-9/_+=.@-]+$"
    ConstraintDescription: Must be an absolute Secrets Manager name beginning with /.
    Description: Secret name; set APPLICATION_SECRET_NAME when overriding this default.

Resources:
  ApplicationSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: holds production app secrets outside source cfg; values are entered in console after stack creation
        must:
          - JSON keys must match Spring configuration property names
          - Do not store RDS master credentials here; RDS manages those separately
          - Retain on stack deletion or replacement
        mutable: change-with-constraints
        mutability:
          Name: must-never-change
    Properties:
      Name: !Ref ApplicationSecretName
      Description: Secrets for the Reason Station production application.
      Tags:
        - Key: Application
          Value: reasonstation
        - Key: Environment
          Value: production

Outputs:
  ApplicationSecretArn:
    Description: ARN of the production application secret.
    Value: !Ref ApplicationSecret
  ApplicationSecretName:
    Description: Name imported by the production Spring profile.
    Value: !Ref ApplicationSecretName
