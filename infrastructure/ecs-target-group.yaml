AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Routes HTTPS traffic to Reason Station - an ACM certificate, Route 53 aliases,
  one ALB, and two target groups enable secure native ECS blue/green deployments.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: Route 53 -> HTTPS ALB -> production rule -> active blue/green ECS target group
    must:
      - Both target groups must use identical health and draining settings
      - Deregistration delay and ECS stop timeout stay aligned at 120 seconds
      - Health checks use readiness, not liveness
      - HTTP must redirect to HTTPS

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC containing the ECS service.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets in at least two Availability Zones for the ALB.
  LoadBalancerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowing public HTTP traffic to the ALB.
  DomainName:
    Type: String
    Default: reasonstation2.net
    AllowedPattern: "^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]{2,63}$"
    Description: Public DNS name served by the application.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Public Route 53 hosted zone used for certificate validation and aliases.

Resources:
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      com.aws.cloudformation.Context:
        why: single shared public entry point; ALB is required for managed blue/green traffic switching
        must:
          - Remain internet-facing while this is the public web entry point
          - Span at least two Availability Zones
        mutable: change-with-constraints
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroupId
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "false"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Application
          Value: reasonstation

  ApplicationCertificate:
    Type: AWS::CertificateManager::Certificate
    Metadata:
      com.aws.cloudformation.Context:
        why: provides an automatically renewed public certificate for the application domain
        must:
          - Validation records must stay in the Route 53 hosted zone
          - Certificate must remain in the same region as the ALB
        mutable: change-with-constraints
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Application
          Value: reasonstation

  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: removes unready tasks from traffic and drains active requests before ECS stops them
        must:
          - Target type must remain ip for Fargate awsvpc tasks
          - Deregistration delay must not exceed the container stop timeout
        mutable: change-with-constraints
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /actuator/health/readiness
      HealthCheckPort: traffic-port
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "120"

  AlternateTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: receives the green service revision before ECS atomically switches production traffic
        must:
          - Configuration must stay aligned with ApplicationTargetGroup
          - Target type must remain ip for Fargate awsvpc tasks
        mutable: change-with-constraints
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /actuator/health/readiness
      HealthCheckPort: traffic-port
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "120"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      com.aws.cloudformation.Context:
        why: redirects all plaintext requests to the canonical HTTPS endpoint
        must:
          - Never serve application traffic over plaintext HTTP
        mutable: change-with-constraints
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      com.aws.cloudformation.Context:
        why: terminates TLS using the DNS-validated ACM certificate
        must:
          - Keep a TLS 1.2 and TLS 1.3 security policy
          - Production traffic must flow through ProductionListenerRule
        mutable: change-with-constraints
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref ApplicationCertificate
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            MessageBody: Not found
            StatusCode: "404"

  ProductionListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Metadata:
      com.aws.cloudformation.Context:
        why: ECS rewrites this rule to switch all production traffic between blue and green target groups
        must:
          - Forward to exactly one of the two service target groups
          - Keep the catch-all path while this ALB serves only Reason Station
        mutable: change-with-constraints
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values:
            - /*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup

  ApplicationDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: maps the apex and www application names directly to the ALB without fixed IP addresses
        must:
          - Preserve existing mail and SES records in the hosted zone
        mutable: change-with-constraints
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt ApplicationLoadBalancer.DNSName
            HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
            EvaluateTargetHealth: true
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt ApplicationLoadBalancer.DNSName
            HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
            EvaluateTargetHealth: true

Outputs:
  TargetGroupArn:
    Description: Primary target group ARN supplied to the ECS service.
    Value: !Ref ApplicationTargetGroup
  AlternateTargetGroupArn:
    Description: Alternate target group ARN used for the green service revision.
    Value: !Ref AlternateTargetGroup
  ProductionListenerRuleArn:
    Description: Listener rule that ECS updates when shifting production traffic.
    Value: !Ref ProductionListenerRule
  LoadBalancerDnsName:
    Description: Public DNS name of the application load balancer.
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  SiteUrl:
    Description: Canonical HTTPS URL for the application.
    Value: !Sub "https://${DomainName}"
