# Local development without an active profile does not require Google reCAPTCHA.
app.recaptcha.enabled=false
# One Reason file (80 MB), image (30 MB), MP3 (80 MB), and multipart overhead.
spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=191MB
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.apache.catalina.connector.Request=DEBUG