<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">Electronic music sawtooth synthesizer</title>
  <defs>
    <linearGradient id="bg" x1="8" y1="5" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082f3a"/>
      <stop offset=".55" stop-color="#0e5361"/>
      <stop offset="1" stop-color="#217786"/>
    </linearGradient>
    <linearGradient id="screen" x1="18" y1="19" x2="77" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#062832"/>
      <stop offset="1" stop-color="#0b3d47"/>
    </linearGradient>
    <linearGradient id="wave" x1="21" y1="39" x2="75" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72c7c7"/>
