  <path d="M21 51 34 25v26l14-26v26l14-26v26l13-26" fill="none" stroke="#89d7d2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".13" filter="url(#glow)"/>
  <path d="M21 51 34 25v26l14-26v26l14-26v26l13-26" fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

