<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Open hi-hat noise waveform</title>
  <desc id="desc">A dense burst of high-frequency noise with a longer fading tail.</desc>
  <defs>
    <linearGradient id="noise" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb23e"/>
      <stop offset=".58" stop-color="#ff8a16"/>
      <stop offset="1" stop-color="#40a7b2"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 120H620" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <path d="M20 120 27 40 34 198 41 62 48 181 55 27 62 207 69 48 76 193 83 35
             90 211 97 57 104 188 111 31 118 202 125 63 132 181 139 42 146 195
             153 54 160 188 167 45 174 191 181 59 188 182 195 51 202 187 209 62
             216 178 223 56 230 182 237 66 244 173 251 61 258 178 265 69 272 169
             279 65 286 174 293 72 300 166 307 69 314 171 321 75 328 163 335 72
             342 168 349 78 356 160 363 75 370 165 377 81 384 158 391 78 398 162
             405 83 412 156 419 81 426 159 433 85 440 153 447 84 454 156 461 87
             468 151 475 86 482 154 489 89 496 149 503 88 510 152 517 91 524 147
             531 90 538 149 545 93 552 145 559 94 566 143 573 96 580 140 587 99
             594 137 601 104 608 132 614 111 620 120"
          stroke="url(#noise)" stroke-width="5" filter="url(#glow)"/>
  </g>
</svg>
