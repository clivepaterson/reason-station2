<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Reason Studios</title>
  <desc id="desc">Orange and black geometric blocks over a halftone music studio background</desc>
  <defs>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.2" fill="#aebbb9"/>
    </pattern>
    <pattern id="small-dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.8" fill="#101416"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0c1012"/>
      <stop offset="0.52" stop-color="#161b1d"/>
      <stop offset="1" stop-color="#0b0e10"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#fade)"/>
  <path d="M0 0h365L220 500H0z" fill="url(#dots)" opacity=".72"/>
  <path d="M1200 0H850l130 500h220z" fill="url(#dots)" opacity=".5"/>
  <path d="M315 0h535L735 145H280z" fill="#d1d8d6" opacity=".14"/>
  <path d="M260 360l670-180 48 180-670 140z" fill="#bec8c6" opacity=".16"/>
  <path d="M275 375l650-174 36 137-650 137z" fill="url(#small-dots)" opacity=".9"/>
  <g opacity=".7" fill="#aebbb9">
    <rect x="650" y="42" width="245" height="76" rx="4"/>
    <rect x="669" y="54" width="18" height="51" fill="#111517"/>
    <rect x="697" y="54" width="18" height="51" fill="#111517"/>
    <rect x="725" y="54" width="18" height="51" fill="#111517"/>
    <rect x="753" y="54" width="18" height="51" fill="#111517"/>
    <rect x="781" y="54" width="18" height="51" fill="#111517"/>
    <rect x="809" y="54" width="18" height="51" fill="#111517"/>
    <rect x="837" y="54" width="18" height="51" fill="#111517"/>
  </g>
  <g opacity=".5" stroke="#aebbb9" stroke-width="9">
    <path d="M45 430L410 130"/>
    <path d="M920 42l240 258"/>
    <path d="M42 108l180 72"/>
  </g>

  <g transform="translate(120 114)" filter="url(#shadow)" stroke="#111517" stroke-width="5" stroke-linejoin="round">
    <path d="M110 0l58 34v68l-58 34-58-34V34z" fill="#ff7a18"/>
    <path d="M110 0l58 34-58 34-58-34z" fill="#ff8b24"/>
    <path d="M168 34v68l-58 34V68z" fill="#15191a"/>
    <path d="M51 103l58 34v68l-58 34-58-34v-68z" fill="#ff7a18"/>
    <path d="M51 103l58 34-58 34-58-34z" fill="#15191a"/>
    <path d="M109 137v68l-58 34v-68z" fill="#ff8b24"/>
    <path d="M169 103l58 34v68l-58 34-58-34v-68z" fill="#ff7a18"/>
    <path d="M169 103l58 34-58 34-58-34z" fill="#ff8b24"/>
    <path d="M169 171l58-34v68l-58 34z" fill="#15191a"/>
    <circle cx="110" cy="137" r="34" fill="#c5d2b1"/>
    <circle cx="110" cy="137" r="25" fill="#15191a"/>
  </g>

  <g fill="#f4f6f5" font-family="Arial, Helvetica, sans-serif">
    <text x="430" y="243" font-size="78" font-weight="900" letter-spacing="-4">REASON</text>
    <text x="430" y="316" font-size="78" font-weight="900" letter-spacing="-4">STUDIOS</text>
    <rect x="435" y="344" width="96" height="7" fill="#ff7a18"/>
    <text x="548" y="354" font-size="21" font-weight="700" letter-spacing="5" fill="#c5cfcd">SYNTHESIS SINCE 2000</text>
  </g>
</svg>
