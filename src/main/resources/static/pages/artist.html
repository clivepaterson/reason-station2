<section id="artist-page" class="tracks-page" hidden>
    <div class="container">
        <div class="tracks-header">
            <div>
                <h1 id="artist-alias-heading">Artist</h1>
                <p>Tracks by this artist</p>
            </div>
        </div>
        <div id="artist-tracks-loading" class="loading-indicator" role="status">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Loading tracks...</span>
        </div>
        <div id="artist-tracks" class="tracks-list" hidden>
        </div>
        <nav id="artist-tracks-pagination" class="search-pagination" aria-label="Artist track pages" hidden>
            <button id="artist-tracks-previous-page" type="button">Previous</button>
            <span id="artist-tracks-page-status" aria-live="polite"></span>
            <button id="artist-tracks-next-page" type="button">Next</button>
        </nav>
        <div class="tracks-header artist-patches-header">
            <div>
                <h2>Patches</h2>
                <p>Patches uploaded by this artist</p>
            </div>
        </div>
        <div id="artist-patches-loading" class="loading-indicator" role="status">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Loading patches...</span>
        </div>
        <div id="artist-patches" hidden>
            <p id="artist-patches-message" hidden></p>
            <div id="artist-patches-list" class="tracks-list"></div>
        </div>
        <nav id="artist-patches-pagination" class="search-pagination" aria-label="Artist patch pages" hidden>
            <button id="artist-patches-previous-page" type="button">Previous</button>
            <span id="artist-patches-page-status" aria-live="polite"></span>
            <button id="artist-patches-next-page" type="button">Next</button>
        </nav>
    </div>
</section>
