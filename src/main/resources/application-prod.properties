spring.config.activate.on-profile=prod
spring.config.import=aws-secretsmanager:${APPLICATION_SECRET_NAME:/reasonstation/prod/application}

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=120s

# Operations endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,s3

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway is the only production schema initializer.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# S3-compatible object storage
app.storage.s3.endpoint=${S3_ENDPOINT}
app.storage.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT}}
app.storage.s3.region=${S3_REGION}
app.storage.s3.bucket=${S3_BUCKET}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.download-url-ttl=${S3_DOWNLOAD_URL_TTL:PT5M}

# Email verification
app.base-url=${APP_BASE_URL}
app.email.from-address=${SES_FROM_ADDRESS}
app.email.ses.region=${SES_REGION}

# Google reCAPTCHA v2 checkbox. Configure both keys and allow the production hostname
# in the reCAPTCHA admin console. The secret key must never be exposed to the browser.
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

# Local OAuth 2.0 / OpenID Connect provider and resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${APP_BASE_URL}
spring.security.oauth2.client.registration.local.provider=local
spring.security.oauth2.client.registration.local.client-id=${LOCAL_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.local.client-secret=${LOCAL_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.local.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.local.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.local.scope=openid,profile,email
spring.security.oauth2.client.provider.local.authorization-uri=${APP_BASE_URL}/oauth2/authorize
spring.security.oauth2.client.provider.local.token-uri=${APP_BASE_URL}/oauth2/token
spring.security.oauth2.client.provider.local.jwk-set-uri=${APP_BASE_URL}/oauth2/jwks
spring.security.oauth2.client.provider.local.user-info-uri=${APP_BASE_URL}/userinfo
spring.security.oauth2.client.provider.local.user-name-attribute=sub

# Social signup providers
spring.security.oauth2.client.registration.google.client-id=${google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${google.client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.apple.client-id=${APPLE_CLIENT_ID}
spring.security.oauth2.client.registration.apple.client-secret=${APPLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.apple.provider=apple
spring.security.oauth2.client.registration.apple.scope=openid,email,name
spring.security.oauth2.client.registration.apple.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.apple.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.apple.authorization-uri=https://appleid.apple.com/auth/authorize
spring.security.oauth2.client.provider.apple.token-uri=https://appleid.apple.com/auth/token
spring.security.oauth2.client.provider.apple.jwk-set-uri=https://appleid.apple.com/auth/keys
spring.security.oauth2.client.provider.apple.user-name-attribute=sub

# Production safety and logging
app.auth.default-user.enabled=false
app.scalar-ui.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.org.reasonstation.logging.SqlQueryLoggingAspect=OFF
